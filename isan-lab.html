tion speak(s,rate){if(!window.speechSynthesis)return alert('音声非対応');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='th-TH';u.rate=rate;speechSynthesis.speak(u)}function line(c,t,s){let x=el('p',s);x.className=t;c.append(x)}for(const m of ['会話','単語','文法','質問を作る','聞き取り'])$('nav').append(button(m,()=>{mode=m;render()}));for(const c of ['すべて',...new Set(rows.map(r=>r[0]))])$('cat').append(new Option(c,c));function render(){let o=$('out');o.replaceChildren();$('count').textContent='';$('filters').hidden=!['会話','聞き取り','単語'].includes(mode);$('cat').hidden=mode==='単語';$('fav').parentElement.hidden=mode==='単語';let q=$('q').value.toLowerCase();if(mode==='単語'){for(let r of vocab.filter(r=>r.join(' ').toLowerCase().includes(q))){let c=el('article','');line(c,'th',r[0]);line(c,'ka',r[1]);line(c,'',r[2]);line(c,'','標準タイ語：'+r[3]+' '+r[4]);c.append(button('🔊',()=>speak(r[0],.8)));o.append(c)}return}if(mode==='文法'){for(let r of [['動詞＋บ่（ボー）','เมื่อยบ่','ムアイ ボー','疲れた？'],['否定 บ่＋動詞','บ่ฮู้','ボー フー','知らない'],['未来 สิ（シ）＋動詞','สิไป','シ パイ','行くつもり'],['疑問詞 หยัง（ニャン）','เฮ็ดหยัง','ヘッ ニャン','何する？'],['語尾 เด้อ（ドー）','พักเด้อ','パック ドー','休んでね']]){let c=el('article','');for(let s of r)line(c,'',s);o.append(c)}return}if(mode==='質問を作る'){let p=el('select','');const verbs=[['กินข้าว','ギン カーオ','ご飯を食べる'],['ไป','パイ','行く'],['พัก','パック','休む'],['เว้า','ワオ','話す']];for(let r of verbs)p.append(new Option(r[2],r[0]));let output=el('article','');function build(){let r=verbs[p.selectedIndex];output.replaceChildren(el('h2',r[0]+'บ่'),el('p',r[1]+' ボー'),el('p',r[2]+'？'),button('🔊',()=>speak(r[0]+'บ่',.8)))}p.onchange=build;o.append(p,output);build();return}let list=rows.map((r,i)=>({r,i})).filter(({r,i})=>($('cat').value==='すべて'||r[0]===$('cat').value)&&r.join(' ').toLowerCase().includes(q)&&(!$('fav').checked||star.includes(i)));$('count').textContent=list.length+'件';for(let {r,i} of list){let c=el('article','');if(mode==='聞き取り'){c.append(button('🔊 聞く',()=>speak(r[2],.75)));let d=el('details','');d.append(el('summary','答えを見る'),el('p',r[2]),el('p',r[3]),el('p',r[1]));c.append(d);o.append(c);continue}line(c,'',r[0]+' · '+r[1]);line(c,'th',r[2]);line(c,'ka',r[3]);c.append(button('🔊',()=>speak(r[2],.9)),button('🐢',()=>speak(r[2],.65)),button(star.includes(i)?'★':'☆',()=>{star=star.includes(i)?star.filter(x=>x!==i):[...star,i];localStorage.setItem('isanLabStar1',JSON.stringify(star));render()}));let d=el('details','');d.append(el('summary','標準タイ語・会話の続き・確認メモ'),el('p',r[4]),el('p',r[5]));if(r[6]){for(let j of [6,9]){d.append(el('p',r[j+2]),el('p',r[j]),el('p',r[j+1]),button('🔊',()=>speak(r[j],.8)))}}let n=el('textarea','');n.placeholder='Fonに確認した表現・発音';n.value=notes[i]||'';d.append(n,button('メモ保存',()=>{notes[i]=n.value;localStorage.setItem('isanLabNotes1',JSON.stringify(notes));alert('保存しました')}));c.append(d);o.append(c)}}for(let id of ['cat','q','fav'])$(id).addEventListener('input',render);render();</script></html>
